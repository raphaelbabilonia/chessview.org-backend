name: Deploy ChessView API

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

concurrency:
  group: chessview-api-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend verification
        run: npm run verify

      - name: Stamp deployment
        run: printf '%s\n' '${{ github.sha }}' > .deployment-sha

      - name: Package verified release
        run: |
          set -euo pipefail
          npm prune --omit=dev --no-audit
          tar -czf "$RUNNER_TEMP/chessview-api.tar.gz" --exclude=.git --exclude=.github --exclude=.env --exclude='.env.*' --exclude=uploads --exclude=coverage --exclude=test --exclude=test-helpers --exclude=docs --exclude=README.md --exclude=.gitignore .

      - name: Deploy through restricted KVM8 gateway
        env:
          CV_HOST: ${{ secrets.CHESSVIEW_VPS_HOST }}
          CV_USER: ${{ secrets.CHESSVIEW_VPS_USER }}
          CV_KEY: ${{ secrets.CHESSVIEW_VPS_SSH_KEY }}
          CV_KNOWN_HOSTS: ${{ secrets.CHESSVIEW_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CV_KEY" > ~/.ssh/chessview_key
          chmod 600 ~/.ssh/chessview_key
          ssh-keygen -y -f ~/.ssh/chessview_key > /dev/null
          printf '%s\n' "$CV_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ARCHIVE="$RUNNER_TEMP/chessview-api.tar.gz"
          ARCHIVE_SHA=$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)
          ssh -T -i ~/.ssh/chessview_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$CV_USER@$CV_HOST" "api $GITHUB_SHA $ARCHIVE_SHA" < "$ARCHIVE"

      - name: Verify public API
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20 https://api.chessview.org/api/health
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20 https://api.chessview.org/api/ready

