name: Event Coordinate Coverage

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: chessview-event-coordinate-coverage
  cancel-in-progress: false

jobs:
  backfill-production-coordinates:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Run production coordinate backfill on KVM8
        env:
          CV_HOST: ${{ secrets.CHESSVIEW_VPS_HOST }}
          CV_USER: ${{ secrets.CHESSVIEW_VPS_USER }}
          CV_KEY: ${{ secrets.CHESSVIEW_VPS_SSH_KEY }}
          CV_KNOWN_HOSTS: ${{ secrets.CHESSVIEW_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CV_KEY" > ~/.ssh/chessview_key
          chmod 600 ~/.ssh/chessview_key
          printf '%s\n' "$CV_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/chessview_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$CV_USER@$CV_HOST" coordinates
